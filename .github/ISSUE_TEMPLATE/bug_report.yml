name: Bug report
description: Report a reproducible problem in VibeCore.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md. Remove credentials and player data from all attachments."
  - type: input
    id: version
    attributes:
      label: VibeCore version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Paper build, Java version and client version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal configuration and dummy data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs and configuration
      render: text
  - type: input
    id: integrations
    attributes:
      label: Relevant integrations and resource packs
