name: Feature request
description: Propose a player or operator improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable results for players or operators.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, permissions and alternatives
