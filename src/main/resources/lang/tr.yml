# VibeCore mesajları (MiniMessage biçimi).
# <ad> yer tutucularına giren değerler düz metin olarak eklenir.
prefix: "<dark_gray>[</dark_gray><gradient:#8b5cf6:#22d3ee>VibeCore</gradient><dark_gray>]</dark_gray> "

command:
  no-permission: "<red>Bunu yapmak için yetkin yok.</red>"
  unknown: "<red>Bilinmeyen alt komut.</red> <gray><white>/vibecore help</white> komutunu kullan.</gray>"
  busy: "<yellow>Arka plan işçileri meşgul. Birazdan tekrar dene.</yellow>"

help:
  header: "<gradient:#8b5cf6:#22d3ee>VibeCore</gradient> <gray>komutları</gray>"
  entry: " <white>/vibecore <command></white> <dark_gray>-</dark_gray> <gray><description></gray>"
  help: "Bu listeyi gösterir"
  status: "Modül durumlarını gösterir"
  diagnostics: "Çalışma zamanı tanı bilgisini gösterir"
  reload: "Yapılandırmayı doğrular ve uygular"
  menu: "Menüleri açar, kapatır ve listeler"
  pack: "Kaynak paketini oluşturur ve durumunu gösterir"
  hud: "HUD gösterir, gizler veya sıfırlar"
  popup: "Oyunculara popup gönderir"

status:
  header: "<gray>Sürüm <white><version></white> · yapılandırma revizyonu <white><revision></white></gray>"
  module: " <white><module></white> <dark_gray>»</dark_gray> <state> <dark_gray>(<reason>)</dark_gray>"
  experimental: " <yellow>deneysel</yellow>"
  state:
    enabled: "<green>etkin</green>"
    disabled: "<gray>kapalı</gray>"
    not-implemented: "<gold>henüz uygulanmadı</gold>"
    unsupported: "<yellow>desteklenmiyor</yellow>"
    failed: "<red>başarısız</red>"

diagnostics:
  header: "<gray>Tanı bilgisi (sır veya oyuncu verisi içermez)</gray>"
  entry: " <gray><key>:</gray> <white><value></white>"

reload:
  started: "<gray>Yapılandırma doğrulanıyor…</gray>"
  success: "<green>Yapılandırma uygulandı.</green> <gray>Revizyon <white><revision></white>.</gray>"
  rejected: "<red>Yapılandırma <count> sorun nedeniyle reddedildi.</red> <gray>Önceki yapılandırma etkin kalır.</gray>"
  problem: " <dark_gray>-</dark_gray> <gray><problem></gray>"
  more: " <dark_gray>… ve <count> sorun daha sunucu günlüğünde.</dark_gray>"
  in-progress: "<yellow>Zaten süren bir yeniden yükleme var.</yellow>"
  restart-required: "<yellow>İşçi ayarları sunucu yeniden başlatılınca değişir.</yellow>"
  module-rejected: "<yellow>Bazı modül dosyaları reddedildi; önceki durumları etkin kalır (<count> sorun):</yellow>"

menu:
  disabled: "<red>Menü modülü etkin değil.</red>"
  usage: "<gray>Kullanım: <white>/vibecore menu open [menü] [oyuncu]</white>, <white>close [oyuncu]</white> veya <white>list</white></gray>"
  unknown: "<red>Bilinmeyen menü: <white><menu></white>.</red>"
  denied: "<red>Bu menüyü açamazsın.</red>"
  target-denied: "<red><player> bu menüyü açamaz.</red>"
  player-missing: "<red>Bu oyuncu çevrimiçi değil.</red>"
  console-target: "<red>Konsoldan çalıştırırken bir oyuncu adı belirt.</red>"
  opened-for: "<gray><white><player></white> için <white><menu></white> açıldı.</gray>"
  closed-for: "<gray><white><player></white> oyuncusunun menüsü kapatıldı.</gray>"
  not-open: "<gray><player> oyuncusunun açık bir VibeCore menüsü yok.</gray>"
  list-header: "<gray>Menüler: <white><count></white></gray>"
  list-entry: " <white><menu></white> <dark_gray>(<rows> satır)</dark_gray>"
  action-error: "<red>Bu işlem tamamlanamadı. Ayrıntılar sunucu günlüğünde.</red>"
  not-enough-money: "<red><white><amount></white> daha paraya ihtiyacın var.</red>"
  not-enough-items: "<red><white><amount> × <material></white> gerekli (yalnız düz eşyalar sayılır).</red>"
  inventory-full: "<red>Envanterinde <white><material></white> için yer yok.</red>"
  economy-missing: "<red>Bu sunucuda kullanılabilir bir ekonomi yok.</red>"
  input-hint: "<gray>Cevabını sohbete yaz; yalnız sen görürsün. Vazgeçmek için <white>iptal</white> yaz.</gray>"
  input-cancelled: "<gray>Giriş iptal edildi.</gray>"
  input-timeout: "<gray>Cevap gelmedi; giriş iptal edildi.</gray>"
  input-invalid: "<red>Bu değer kabul edilmedi: <reason>.</red>"

pack:
  disabled: "<red>Paket modülü etkin değil.</red>"
  usage: "<gray>Kullanım: <white>/vibecore pack status</white>, <white>build</white> veya <white>send [oyuncu|*]</white></gray>"
  building: "<gray>Kaynak paketi oluşturuluyor…</gray>"
  built: "<green>Kaynak paketi oluşturuldu.</green> <gray>SHA-1 <white><hash></white>, <white><size></white> bayt, <white><glyphs></white> glyph, <white><items></white> item modeli.</gray>"
  rejected: "<red>Kaynak paketi oluşturulmadı: <count> sorun.</red> <gray>Önceki paket yerinde kalır.</gray>"
  status: "<gray>Paket SHA-1 <white><hash></white> · <white><size></white> bayt · <white><glyphs></white> glyph · <white><items></white> item modeli · oluşturma <white><time></white></gray>"
  none: "<gray>Henüz kaynak paketi oluşturulmadı.</gray>"
  prompt: "<gray>Bu sunucu menüleri ve simgeleri için VibeCore kaynaklarını kullanır.</gray>"
  offered: "<gray>Kaynak paketi <white><count></white> oyuncuya sunuldu.</gray>"
  no-build: "<red>Henüz kaynak paketi oluşturulmadı.</red>"
  no-url: "<red>Önce config.yml içindeki pack.url değerini yüklenen paketin HTTPS adresi yap.</red>"
  not-loaded: "<yellow>Kaynak paketi yüklenmedi; bazı simgeler farklı görünebilir.</yellow>"
  kick: "<red>Bu sunucu kaynak paketini gerektirir. Sunucu kaynak paketlerine izin verip tekrar katıl.</red>"
  delivery: "<gray>Çevrimiçi oyuncuların paket yanıtları: <white><counts></white></gray>"

hud:
  disabled: "<red>HUD modülü etkin değil.</red>"
  usage: "<gray>Kullanım: <white>/vibecore hud show [hud] [oyuncu]</white>, <white>hide</white>, <white>reset</white> veya <white>who [oyuncu]</white></gray>"
  unknown: "<red>Bilinmeyen HUD: <white><hud></white>.</red>"
  shown: "<gray><white><player></white> için <white><hud></white> sıfırlanana kadar gösteriliyor.</gray>"
  hidden: "<gray><white><player></white> için HUD sıfırlanana kadar gizlendi.</gray>"
  reset: "<gray><white><player></white> oyuncusunun HUD seçimi yeniden koşullara bağlı.</gray>"
  who: "<gray><white><player></white> şu HUD'u görüyor: <white><hud></white> (<reason>).</gray>"

popup:
  usage: "<gray>Kullanım: <white>/vibecore popup [popup] [oyuncu|*]</white></gray>"
  unknown: "<red>Bilinmeyen popup: <white><popup></white>.</red>"
  queued: "<gray>Popup <white><count></white> oyuncu için sıraya alındı; <white><full></white> sıra doluydu.</gray>"
