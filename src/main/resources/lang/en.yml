# VibeCore messages (MiniMessage format).
# Values inside <name> placeholders are inserted as plain text.
prefix: "<dark_gray>[</dark_gray><gradient:#8b5cf6:#22d3ee>VibeCore</gradient><dark_gray>]</dark_gray> "

command:
  no-permission: "<red>You do not have permission to do that.</red>"
  unknown: "<red>Unknown subcommand.</red> <gray>Use <white>/vibecore help</white>.</gray>"
  busy: "<yellow>Background workers are busy. Try again shortly.</yellow>"

help:
  header: "<gradient:#8b5cf6:#22d3ee>VibeCore</gradient> <gray>commands</gray>"
  entry: " <white>/vibecore <command></white> <dark_gray>-</dark_gray> <gray><description></gray>"
  help: "Show this list"
  status: "Show module states"
  diagnostics: "Show runtime diagnostics"
  reload: "Validate and apply configuration"
  menu: "Open, close and list menus"
  pack: "Build the resource pack and show its status"

status:
  header: "<gray>Version <white><version></white> · configuration revision <white><revision></white></gray>"
  module: " <white><module></white> <dark_gray>»</dark_gray> <state> <dark_gray>(<reason>)</dark_gray>"
  experimental: " <yellow>experimental</yellow>"
  state:
    enabled: "<green>enabled</green>"
    disabled: "<gray>disabled</gray>"
    not-implemented: "<gold>not implemented</gold>"
    unsupported: "<yellow>unsupported</yellow>"
    failed: "<red>failed</red>"

diagnostics:
  header: "<gray>Diagnostics (no secrets or player data)</gray>"
  entry: " <gray><key>:</gray> <white><value></white>"

reload:
  started: "<gray>Validating configuration…</gray>"
  success: "<green>Configuration applied.</green> <gray>Revision <white><revision></white>.</gray>"
  rejected: "<red>Configuration rejected with <count> problem(s).</red> <gray>The previous configuration stays active.</gray>"
  problem: " <dark_gray>-</dark_gray> <gray><problem></gray>"
  more: " <dark_gray>… and <count> more in the server log.</dark_gray>"
  in-progress: "<yellow>A reload is already in progress.</yellow>"
  restart-required: "<yellow>Worker settings change after a restart.</yellow>"
  module-rejected: "<yellow>Some module files were rejected; their previous state stays active (<count> problem(s)):</yellow>"

menu:
  disabled: "<red>The menu module is not enabled.</red>"
  usage: "<gray>Usage: <white>/vibecore menu open [menu] [player]</white>, <white>close [player]</white> or <white>list</white></gray>"
  unknown: "<red>Unknown menu <white><menu></white>.</red>"
  denied: "<red>You cannot open this menu.</red>"
  target-denied: "<red><player> cannot open this menu.</red>"
  player-missing: "<red>That player is not online.</red>"
  console-target: "<red>Name a player when running this from the console.</red>"
  opened-for: "<gray>Opened <white><menu></white> for <white><player></white>.</gray>"
  closed-for: "<gray>Closed the menu of <white><player></white>.</gray>"
  not-open: "<gray><player> has no VibeCore menu open.</gray>"
  list-header: "<gray>Menus: <white><count></white></gray>"
  list-entry: " <white><menu></white> <dark_gray>(<rows> rows)</dark_gray>"
  action-error: "<red>This action could not be completed. The server log has details.</red>"
  not-enough-money: "<red>You need <white><amount></white> more money.</red>"
  not-enough-items: "<red>You need <white><amount> × <material></white> (plain items only).</red>"
  inventory-full: "<red>Your inventory has no room for <white><material></white>.</red>"
  economy-missing: "<red>No economy is available on this server.</red>"
  input-hint: "<gray>Type your answer in chat; only you see it. Type <white>cancel</white> to stop.</gray>"
  input-cancelled: "<gray>Input cancelled.</gray>"
  input-timeout: "<gray>No answer received; input cancelled.</gray>"
  input-invalid: "<red>That value was not accepted: <reason>.</red>"

pack:
  disabled: "<red>The pack module is not enabled.</red>"
  usage: "<gray>Usage: <white>/vibecore pack status</white> or <white>build</white></gray>"
  building: "<gray>Building the resource pack…</gray>"
  built: "<green>Resource pack built.</green> <gray>SHA-1 <white><hash></white>, <white><size></white> bytes, <white><glyphs></white> glyph(s), <white><items></white> item model(s).</gray>"
  rejected: "<red>Resource pack not built: <count> problem(s).</red> <gray>The previous pack stays in place.</gray>"
  status: "<gray>Pack SHA-1 <white><hash></white> · <white><size></white> bytes · <white><glyphs></white> glyph(s) · <white><items></white> item model(s) · built <white><time></white></gray>"
  none: "<gray>No resource pack has been built yet.</gray>"
