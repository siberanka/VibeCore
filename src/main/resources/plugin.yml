name: VibeCore
version: '@project.version@'
main: com.siberanka.vibecore.VibeCorePlugin
api-version: '@paper.api-version@'
description: '@project.description@'
author: siberanka
softdepend: [Vault, PlaceholderAPI]

commands:
  vibecore:
    description: VibeCore administration and information.
    usage: /vibecore help
    permission: vibecore.command.help

permissions:
  vibecore.command.help:
    description: Shows the VibeCore commands the sender may use.
    default: true
  vibecore.admin.status:
    description: Shows the state of every VibeCore module.
    default: op
  vibecore.admin.diagnostics:
    description: Shows redacted runtime diagnostics.
    default: op
  vibecore.admin.reload:
    description: Validates and activates configuration and messages.
    default: op
  vibecore.menu.open:
    description: Opens menus for yourself; each menu may require its own permission as well.
    default: true
  vibecore.menu.open.others:
    description: Opens menus for other players; the viewer must still be allowed to open the menu.
    default: op
  vibecore.menu.close.others:
    description: Closes the VibeCore menu of another player.
    default: op
  vibecore.menu.list:
    description: Lists the loaded menus.
    default: op
  vibecore.pack.status:
    description: Shows the resource pack status.
    default: op
  vibecore.pack.build:
    description: Builds the resource pack.
    default: op
  vibecore.admin:
    description: Grants the listed administration permissions only.
    default: op
    children:
      vibecore.command.help: true
      vibecore.admin.status: true
      vibecore.admin.diagnostics: true
      vibecore.admin.reload: true
      vibecore.menu.open: true
      vibecore.menu.open.others: true
      vibecore.menu.close.others: true
      vibecore.menu.list: true
      vibecore.pack.status: true
      vibecore.pack.build: true
